<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101110" />
    <script>
      try {
        const savedTheme = localStorage.getItem("anetrace.theme.v1")
        document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
      } catch {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
    <meta
      name="description"
      content="AneTrace: an open intraoperative case replay and teaching annotation tool."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>AneTrace · Intraoperative Case Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
